<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' blob:" />
  <title>Retorno da webcam</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    #wrap {
      position: fixed; inset: 0;
      border-radius: 14px; overflow: hidden;
      background: #000;
      border: 2px solid rgba(255, 255, 255, .35);
      -webkit-app-region: drag;       /* arrasta segurando em qualquer ponto */
      cursor: move;
    }
    video {
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);          /* espelho, como um monitor de retorno */
      pointer-events: none;
    }
    #close {
      position: absolute; top: 6px; right: 6px;
      width: 24px; height: 24px; border-radius: 50%;
      border: none; cursor: pointer;
      background: rgba(0, 0, 0, .6); color: #fff;
      font: 700 13px/1 sans-serif;
      opacity: 0; transition: opacity .15s;
      -webkit-app-region: no-drag;
    }
    #wrap:hover #close { opacity: 1; }
  </style>
</head>
<body>
  <div id="wrap">
    <video id="v" autoplay muted playsinline></video>
    <button id="close" title="Fechar retorno">×</button>
  </div>
  <script src="campopup.js"></script>
</body>
</html>
